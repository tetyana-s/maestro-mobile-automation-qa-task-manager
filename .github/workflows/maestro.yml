name: Maestro Mobile Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  maestro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, regression]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Prepare report directories
        run: mkdir -p reports/smoke reports/regression

      - name: Run ${{ matrix.suite }} tests and build reports
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: Pixel_2
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            mkdir -p "reports/${{ matrix.suite }}"
            set +e
            npx expo run:android > "reports/${{ matrix.suite }}/android-build.log" 2>&1
            build_status=$?
            set -e
            cat "reports/${{ matrix.suite }}/android-build.log"
            if [ "$build_status" -ne 0 ]; then
              echo "Android build/install failed with exit code $build_status"
              exit "$build_status"
            fi
            attempt=1
            max_attempts=3
            until node scripts/run-maestro-report.mjs "${{ matrix.suite }}"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "${{ matrix.suite }} failed after $max_attempts attempts"
                exit 1
              fi
              attempt=$((attempt + 1))
              echo "${{ matrix.suite }} failed; retrying (attempt $attempt/$max_attempts)"
            done

      - name: Upload Maestro reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-${{ matrix.suite }}-reports
          path: reports/
          if-no-files-found: warn
